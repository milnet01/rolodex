name: CI

# Lint + test gate on every push and PR to main (ROLO-0020). Runs ruff (style/lint) and the
# pytest suite. The tests import rolodex.py, which imports gi at module load, so the job needs
# the system GTK 4 / libadwaita + PyGObject stack from apt — a setup-python interpreter would
# not have `gi`. This mirrors the apt install in build.yml so the two workflows can't drift.
#
# Public repo = free Linux runner minutes, so this runs on every push/PR rather than on demand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress (zizmor concurrency-limits).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint (ruff) + test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK stack + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 xvfb xauth
          python3 -m pip install --break-system-packages --upgrade ruff mypy pytest cryptography

      - name: Lint (ruff)
        run: ruff check rolodex.py tests/

      # mypy.ini turns on check_untyped_defs, so every function body is analysed (ROLO-0052).
      - name: Type-check (mypy)
        run: mypy rolodex.py

      # Under a virtual display. tests/test_widgets.py builds real GTK widgets, and on the
      # runner's GTK 4.14 / libadwaita 1.5 that fails with no display and then segfaults the
      # whole run -- which is how every run from ROLO-0059 onward went red. Reproduced in an
      # ubuntu:24.04 container: no display fails, xvfb-run passes the full suite.
      - name: Test (pytest)
        run: xvfb-run -a python3 -m pytest tests/ -q
