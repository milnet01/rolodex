# mypy configuration (ROLO-0052).
#
# check_untyped_defs: by default mypy SKIPS the body of any function without annotations, so a
# clean run said nothing about roughly half of this file. With it on, every body is analysed.
#
# Annotations themselves are required only in the pure-logic layer (coding-standards.md: "GUI
# callbacks may omit them"). mypy cannot scope disallow_untyped_defs to part of one file, so
# tests/test_regressions.py::test_ROLO0052_pure_layer_functions_are_annotated enforces that
# rule instead.
[mypy]
check_untyped_defs = True

# PyGObject ships no type stubs.
[mypy-gi.*]
ignore_missing_imports = True
